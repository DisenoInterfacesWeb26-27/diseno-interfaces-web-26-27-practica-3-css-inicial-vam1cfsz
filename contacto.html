                <input type="tel" id="telefono" name="telefono" required placeholder="Introduce tu teléfono"><br>

                <input type="checkbox" id="privacidad" name="privacidad" required><br>
                <label for ="consulta">Consulta:</label>
                <textarea id="consulta" name="consulta" rows="4" cols="50" required placeholder="Introduce aquí tu consulta"></textarea><br>
